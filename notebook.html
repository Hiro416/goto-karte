<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>誤答カルテ</title><link rel="stylesheet" href="notebook.css">
  <script src="core.js" defer></script><script src="notebook.js" defer></script>
</head>
<body>
  <header><div><p class="eyebrow">GOTO KARTE / STUDY NOTEBOOK</p><h1>誤答カルテ</h1><p id="stats">読み込み中…</p></div>
    <div class="settings"><label><input type="checkbox" id="enabled"> 自動保存</label><label><input type="checkbox" id="uncertain"> テコプラの△・ヒント使用も保存</label></div>
  </header>
  <nav aria-label="書き出しとバックアップ"><button id="markdown">表示中をMarkdownに</button><button id="backup">全件をJSONでバックアップ</button><label class="file-button">JSONを復元<input type="file" id="restore" accept=".json,application/json"></label></nav>
  <p class="hint">このChromeに保存します。拡張を削除するとデータも消えるため、定期的にJSONを書き出してください。画像は参照URLのみです。</p>
  <div id="message" role="status" aria-live="polite"></div>
  <main>
    <aside><label for="search">問題・解説・メモを検索</label><input id="search" type="search" placeholder="キーワード・問題番号">
      <div class="filters"><select id="source" aria-label="サービス"><option value="">両サービス</option><option value="tecopla-cbt">テコプラ</option><option value="qb-cbt">QB CBT</option></select><select id="review" aria-label="復習状況"><option value="all">すべて</option><option value="pending">未復習</option><option value="done">復習済み</option></select></div>
      <select id="category" aria-label="分野"><option value="">すべての分野</option></select>
      <p id="count"></p><div id="list"></div>
    </aside>
    <article id="detail"><div class="empty"><h2>ここに誤答がたまります</h2><p>拡張を読み込んだあと、テコプラ・QB CBTの演習ページを再読み込みして問題を解いてください。不正解になると自動で保存します。</p><p>導入前の誤答も、解答済みの画面を開くと保存できます。</p></div></article>
  </main>
</body></html>
